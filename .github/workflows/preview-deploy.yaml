name: Preview Deployment (SSR Lambda)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  # Any branch, on demand: called by deploy-branch.yaml (run from main; the environments only allow main).
  # It replaces that site's preview until the next deploy.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      site:
        type: string
        required: false
        default: all

permissions:
  id-token: write # GitHub OIDC -> AWS role, no long-lived keys
  contents: read

env:
  # Same list as prod-deploy.yaml
  SITES: '["sensatempo","kevinavila"]'
  AWS_ACCOUNT_ID: '221135164152'

jobs:
  # Pushes deploy every site's preview; manual deploys the chosen (or all) sites
  targets:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.pick.outputs.sites }}
    steps:
      - id: pick
        env:
          PAYLOAD_SITE: ${{ github.event.client_payload.site }}
          INPUT_SITE: ${{ inputs.site }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            repository_dispatch) WANTED="${PAYLOAD_SITE:-sensatempo}" ;;
            *) WANTED="${INPUT_SITE:-all}" ;;
          esac
          if [ "$WANTED" = all ]; then
            echo "sites=$SITES" >> "$GITHUB_OUTPUT"
          elif echo "$SITES" | jq -e --arg s "$WANTED" 'index($s)' >/dev/null; then
            echo "sites=$(jq -cn --arg s "$WANTED" '[$s]')" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown site '$WANTED'"; exit 1
          fi

  deploy-preview:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.targets.outputs.sites) }}
    name: deploy (${{ matrix.site }})
    environment: ${{ matrix.site }}
    # One preview Lambda per site: let the latest deploy win instead of racing
    concurrency:
      group: preview-deploy-${{ matrix.site }}
      cancel-in-progress: true
    env:
      SITE: ${{ matrix.site }}
    steps:
      # Repository-level variables leak into every environment, so a site only deploys once its
      # environment says who it is (SITE); names below derive from it, never from inherited values
      - name: Check the environment
        id: ready
        env:
          ENV_SITE: ${{ vars.SITE }}
          ENV_DIST_ID: ${{ vars.AWS_CF_DIST_ID }}
        run: |
          if [ "$ENV_SITE" != "$SITE" ] || [ -z "$ENV_DIST_ID" ]; then
            echo "::warning::Environment '$SITE' isn't set up (needs SITE=$SITE and AWS_CF_DIST_ID); skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Code
        if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v6
        if: steps.ready.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.ready.outputs.ok == 'true'

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ matrix.site }}-github-deploy
          aws-region: us-east-1

      # Build secrets live in SSM Parameter Store, not GitHub (see README "Secrets")
      - name: Load secrets from SSM
        if: steps.ready.outputs.ok == 'true'
        run: |
          TOKEN=$(aws ssm get-parameter --name /$SITE/storyblok/preview-token \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$TOKEN"
          echo "STORYBLOK_PREVIEW_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # Builds the SSR server and zips it with linux-arm64 runtime deps
      - name: Package preview Lambda
        if: steps.ready.outputs.ok == 'true'
        run: scripts/package-preview.sh preview-lambda.zip
        env:
          PUBLIC_DEFAULT_LANGUAGE: ${{ vars.PUBLIC_DEFAULT_LANGUAGE }}
          PUBLIC_AVAILABLE_LANGUAGES: ${{ vars.PUBLIC_AVAILABLE_LANGUAGES }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_SITE_URL: ${{ vars.PREVIEW_SITE_URL }}
          PUBLIC_THEME: ${{ vars.PUBLIC_THEME }}
          PUBLIC_SITE_NAME: ${{ vars.PUBLIC_SITE_NAME }}
          PUBLIC_SITE_DESCRIPTION: ${{ vars.PUBLIC_SITE_DESCRIPTION }}

      - name: Update Lambda Function
        if: steps.ready.outputs.ok == 'true'
        run: |
          aws lambda update-function-code \
            --function-name "$SITE-preview-ssr" \
            --zip-file fileb://preview-lambda.zip
          aws lambda wait function-updated --function-name "$SITE-preview-ssr"

      - name: Summary
        if: steps.ready.outputs.ok == 'true'
        run: echo "Deployed \`$REF\` ($(git rev-parse --short HEAD)) to the $SITE preview" >> "$GITHUB_STEP_SUMMARY"
        env:
          REF: ${{ inputs.ref || github.ref_name }}
