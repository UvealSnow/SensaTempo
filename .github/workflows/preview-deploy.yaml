name: Preview Deployment (SSR Lambda)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  # Manual trigger from the "Actions" tab. Run it from main (the AWS role only trusts main)
  # and pick any branch to build; it replaces the shared preview until the next deploy.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy to the preview
        required: true
        default: main

# One preview Lambda: let the latest deploy win instead of racing
concurrency:
  group: preview-deploy
  cancel-in-progress: true

permissions:
  id-token: write # GitHub OIDC -> AWS role, no long-lived keys
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Build secrets live in SSM Parameter Store, not GitHub (see README "Secrets")
      - name: Load secrets from SSM
        run: |
          TOKEN=$(aws ssm get-parameter --name /sensatempo/storyblok/access-token \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$TOKEN"
          echo "STORYBLOK_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # Builds the SSR server and zips it with linux-arm64 runtime deps
      - name: Package preview Lambda
        run: scripts/package-preview.sh preview-lambda.zip
        env:
          PUBLIC_DEFAULT_LANGUAGE: ${{ vars.PUBLIC_DEFAULT_LANGUAGE }}
          PUBLIC_AVAILABLE_LANGUAGES: ${{ vars.PUBLIC_AVAILABLE_LANGUAGES }}

      - name: Update Lambda Function
        run: |
          aws lambda update-function-code \
            --function-name sensatempo-preview-ssr \
            --zip-file fileb://preview-lambda.zip
          aws lambda wait function-updated --function-name sensatempo-preview-ssr

      - name: Summary
        run: echo "Deployed \`$REF\` ($(git rev-parse --short HEAD)) to the preview" >> "$GITHUB_STEP_SUMMARY"
        env:
          REF: ${{ inputs.ref || github.ref_name }}
