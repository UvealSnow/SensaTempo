name: Preview Deployment (SSR Lambda)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  # Manual trigger from the "Actions" tab (the AWS role only trusts main)
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> AWS role, no long-lived keys
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the SSR server and zips it with linux-arm64 runtime deps
      - name: Package preview Lambda
        run: scripts/package-preview.sh preview-lambda.zip
        env:
          STORYBLOK_ACCESS_TOKEN: ${{ secrets.STORYBLOK_ACCESS_TOKEN }}
          PUBLIC_DEFAULT_LANGUAGE: ${{ vars.PUBLIC_DEFAULT_LANGUAGE }}
          PUBLIC_AVAILABLE_LANGUAGES: ${{ vars.PUBLIC_AVAILABLE_LANGUAGES }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Update Lambda Function
        run: |
          aws lambda update-function-code \
            --function-name sensatempo-preview-ssr \
            --zip-file fileb://preview-lambda.zip
          aws lambda wait function-updated --function-name sensatempo-preview-ssr
