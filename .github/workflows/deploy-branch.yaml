name: Deploy branch

# Manual deploy of any branch, tag or SHA. Keep "Use workflow from" on main: each site's
# environment only allows main, which is checked against this (calling) workflow's ref.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy
        required: true
        default: main
      target:
        description: Where to deploy it
        type: choice
        options: [preview, production, both]
        default: preview
      site:
        description: Which site
        type: choice
        options: [all, sensatempo, kevinavila]
        default: all

permissions:
  id-token: write # GitHub OIDC -> AWS role, no long-lived keys
  contents: read

jobs:
  preview:
    if: inputs.target != 'production'
    uses: ./.github/workflows/preview-deploy.yaml
    with:
      ref: ${{ inputs.ref }}
      site: ${{ inputs.site }}

  production:
    if: inputs.target != 'preview'
    uses: ./.github/workflows/prod-deploy.yaml
    with:
      ref: ${{ inputs.ref }}
      site: ${{ inputs.site }}
