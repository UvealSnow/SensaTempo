name: Production deployment

on:
  # We have a new main version
  push:
    branches: [main]
  # the CMS sent a webhook telling us the content has been updated.
  # repository_dispatch:
  #   types: [content_updated]
  # Allows to manually trigger this for any branch from the "Actions" tab
  workflow_dispatch:

jobs:
  deploy-static-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile pins linux/arm64, so the x86 runner needs emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Write build secrets
        run: echo "STORYBLOK_ACCESS_TOKEN=$STORYBLOK_ACCESS_TOKEN" > "$RUNNER_TEMP/build.env"
        env:
          STORYBLOK_ACCESS_TOKEN: ${{ secrets.STORYBLOK_ACCESS_TOKEN }}

      - name: Build static assets
        run: |
          docker build -f ./docker/Dockerfile \
            --secret id=DOTENV,src="$RUNNER_TEMP/build.env" \
            --build-arg PUBLIC_DEFAULT_LANGUAGE=${{ vars.PUBLIC_DEFAULT_LANGUAGE }} \
            --build-arg PUBLIC_AVAILABLE_LANGUAGES=${{ vars.PUBLIC_AVAILABLE_LANGUAGES }} \
            --target build-prod \
            -t sensatempo-prod:latest .
          docker create --name tmp-container sensatempo-prod:latest
          docker cp tmp-container:/app/dist ./dist
          docker rm tmp-container

      - name: Deploy to S3
        run: |
          aws s3 sync ./dist s3://${{ secrets.AWS_PROD_BUCKET }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CF_DIST_ID }} --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
