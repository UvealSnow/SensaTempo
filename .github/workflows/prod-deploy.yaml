name: Production deployment

on:
  # We have a new main version
  push:
    branches: [main]
  # the CMS sent a webhook telling us the content has been updated.
  # repository_dispatch:
  #   types: [content_updated]
  # Manual trigger from the "Actions" tab (the AWS role only trusts main)
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> AWS role, no long-lived keys
  contents: read

jobs:
  deploy-static-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Build secrets live in SSM Parameter Store, not GitHub (see README "Secrets")
      - name: Load secrets from SSM
        run: |
          TOKEN=$(aws ssm get-parameter --name /sensatempo/storyblok/public-token \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$TOKEN"
          echo "STORYBLOK_PUBLIC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Build static site
        run: pnpm build
        env:
          PUBLIC_DEFAULT_LANGUAGE: ${{ vars.PUBLIC_DEFAULT_LANGUAGE }}
          PUBLIC_AVAILABLE_LANGUAGES: ${{ vars.PUBLIC_AVAILABLE_LANGUAGES }}
          PUBLIC_BUILD_TYPE: static

      - name: Deploy to S3
        run: |
          aws s3 sync ./dist s3://${{ vars.AWS_PROD_BUCKET }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.AWS_CF_DIST_ID }} --paths "/*"
