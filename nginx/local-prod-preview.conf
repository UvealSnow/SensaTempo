server {
    listen 8080;
    server_name localhost;

    # Root directory where your static files are
    root /usr/share/nginx/html;
    index index.html;

    # Support for routing: if a file isn't found, serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}